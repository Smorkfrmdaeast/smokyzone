<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="50%" stop-color="#08122c" />
      <stop offset="100%" stop-color="#040814" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1f45" />
      <stop offset="100%" stop-color="#0a1532" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Top bar -->
  <rect width="100%" height="70" fill="#040814" />
  <text x="50" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" fill="#eab308">
    🎓 Admissions Open 2026/2027 Academic Session
  </text>
  <text x="600" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" fill="#94a3b8">
    📞 +234 808 619 9722  ·  ✉ admissions@prestigeacademyschools.com
  </text>

  <!-- Navbar -->
  <g transform="translate(50, 110)">
    <circle cx="35" cy="35" r="28" fill="#1e3a8a" />
    <text x="35" y="44" font-size="26" text-anchor="middle" fill="#eab308">🎓</text>
    <text x="80" y="32" font-family="'Outfit', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" letter-spacing="2">
      PRESTIGE ACADEMY
    </text>
    <text x="80" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#eab308" letter-spacing="3">
      SCHOOLS OF DISTINCTION &amp; LEADERSHIP
    </text>

    <!-- Apply Button -->
    <rect x="800" y="10" width="180" height="50" rx="8" fill="#7f1d1d" />
    <text x="890" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      Apply Online
    </text>
  </g>

  <!-- Hero Content -->
  <g transform="translate(70, 260)">
    <!-- Badge -->
    <rect x="0" y="0" width="460" height="42" rx="21" fill="#1e3a8a" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.5" />
    <text x="30" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="600" fill="#60a5fa">
      ✨ Ranked Among Nigeria's Top Educational Academies
    </text>

    <!-- Main Headline -->
    <text x="0" y="130" font-family="'Outfit', 'Playfair Display', serif" font-size="64" font-weight="800" fill="#FFFFFF">
      Nurturing <tspan fill="#f97316">Visionary</tspan>
    </text>
    <text x="0" y="205" font-family="'Outfit', 'Playfair Display', serif" font-size="64" font-weight="800" fill="#f97316">
      Leaders <tspan fill="#FFFFFF">&amp; Academic</tspan>
    </text>
    <text x="0" y="280" font-family="'Outfit', 'Playfair Display', serif" font-size="64" font-weight="800" fill="#FFFFFF">
      Distinction
    </text>

    <!-- Subtitle text -->
    <text x="0" y="350" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" fill="#cbd5e1" width="900">
      At <tspan font-weight="700" fill="#ffffff">Prestige Academy Schools</tspan>, we integrate the British Cambridge &amp;
    </text>
    <text x="0" y="388" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" fill="#cbd5e1">
      Nigerian NERDC curricula with state-of-the-art STEM innovation, robotics,
    </text>
    <text x="0" y="426" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" fill="#cbd5e1">
      creative arts, and uncompromising moral discipline.
    </text>

    <!-- Check items -->
    <g transform="translate(0, 480)" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" fill="#e2e8f0">
      <text x="0" y="0">✔ Creche to Senior High College</text>
      <text x="480" y="0">✔ Cambridge &amp; WAEC Centre</text>
      <text x="0" y="50">✔ Robotics &amp; Coding Labs</text>
      <text x="480" y="50">✔ Ultra-Modern Boarding Facilities</text>
    </g>

    <!-- CTAs -->
    <g transform="translate(0, 600)">
      <rect x="0" y="0" width="300" height="70" rx="12" fill="#7f1d1d" />
      <text x="150" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">
        Enroll for 2026/2027 →
      </text>

      <rect x="330" y="0" width="280" height="70" rx="12" fill="none" stroke="#64748b" stroke-width="2" />
      <text x="470" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="600" fill="#e2e8f0" text-anchor="middle">
        🧭 Book Campus Tour
      </text>
    </g>
  </g>

  <!-- Distinctions Grid Box -->
  <g transform="translate(70, 1030)">
    <rect x="0" y="0" width="940" height="720" rx="24" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="2" />
    
    <text x="40" y="60" font-family="'Outfit', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">
      🏆 Academic Distinctions
    </text>
    <text x="40" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#94a3b8">
      Class of 2025/2026 Examination Highlights
    </text>

    <!-- 4 Stats Cards -->
    <g transform="translate(40, 140)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="410" height="200" rx="16" fill="#070d1e" stroke="#1e3a8a" stroke-width="1.5" />
      <text x="30" y="80" font-family="'Outfit', sans-serif" font-size="56" font-weight="900" fill="#38bdf8">99.8%</text>
      <text x="30" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">WAEC &amp; NECO Pass</text>
      <text x="30" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" fill="#64748b">Distinction in Sciences</text>

      <!-- Card 2 -->
      <rect x="450" y="0" width="410" height="200" rx="16" fill="#070d1e" stroke="#1e3a8a" stroke-width="1.5" />
      <text x="480" y="80" font-family="'Outfit', sans-serif" font-size="56" font-weight="900" fill="#34d399">100%</text>
      <text x="480" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">University Placement</text>
      <text x="480" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" fill="#64748b">Nigeria, UK, USA &amp; Canada</text>

      <!-- Card 3 -->
      <rect x="0" y="240" width="410" height="200" rx="16" fill="#070d1e" stroke="#1e3a8a" stroke-width="1.5" />
      <text x="30" y="320" font-family="'Outfit', sans-serif" font-size="56" font-weight="900" fill="#a78bfa">12 : 1</text>
      <text x="30" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Pupil - Teacher Ratio</text>
      <text x="30" y="400" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" fill="#64748b">Individual Attention</text>

      <!-- Card 4 -->
      <rect x="450" y="240" width="410" height="200" rx="16" fill="#070d1e" stroke="#1e3a8a" stroke-width="1.5" />
      <text x="480" y="320" font-family="'Outfit', sans-serif" font-size="56" font-weight="900" fill="#fbbf24">30+</text>
      <text x="480" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Clubs &amp; Sports</text>
      <text x="480" y="400" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" fill="#64748b">STEM, Debate &amp; Athletics</text>
    </g>

    <g transform="translate(40, 620)">
      <rect x="0" y="0" width="860" height="60" rx="12" fill="#070d1e" />
      <text x="30" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" fill="#cbd5e1">
        📖 Check Admission Application Status
      </text>
    </g>
  </g>
</svg>
