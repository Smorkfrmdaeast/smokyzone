<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E90FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0052cc" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#phoneBg)" rx="16" />

  <!-- Grid texture background -->
  <g stroke="#1E90FF" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <!-- Smartphone Frame Center -->
  <g transform="translate(400, 300)">
    <!-- Outer Phone Body -->
    <rect x="-140" y="-230" width="280" height="460" rx="36" fill="#0c172e" stroke="#1E90FF" stroke-width="4" filter="drop-shadow(0 0 20px rgba(30,144,255,0.3))" />
    
    <!-- Phone Screen -->
    <rect x="-120" y="-195" width="240" height="390" rx="20" fill="url(#screenGlow)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Camera pill & speaker -->
    <rect x="-35" y="-215" width="70" height="8" rx="4" fill="#1e293b" />
    <circle cx="20" cy="-211" r="3" fill="#1E90FF" />

    <!-- Firmware Flashing Console Graphics -->
    <!-- Flash Status Header -->
    <rect x="-105" y="-170" width="210" height="32" rx="6" fill="#070d1e" stroke="#1E90FF" stroke-width="1" />
    <text x="-95" y="-149" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#1E90FF">
      ROM FLASH // OK
    </text>

    <!-- Progress Bar -->
    <rect x="-105" y="-120" width="210" height="14" rx="7" fill="#070d1e" stroke="#1e3a8a" stroke-width="1" />
    <rect x="-103" y="-118" width="170" height="10" rx="5" fill="#1E90FF" />
    <text x="75" y="-108" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8">85%</text>

    <!-- System Unlock & Flash glyphs -->
    <g transform="translate(0, -10)">
      <!-- Unlocked Padlock -->
      <path d="M -15 -25 L -15 -45 C -15 -60, 15 -60, 15 -45 L 7 -45 C 7 -54, -7 -54, -7 -45 L -7 -25" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" />
      <rect x="-24" y="-25" width="48" height="40" rx="8" fill="#152445" stroke="#22c55e" stroke-width="2" />
      <circle cx="0" cy="-5" r="4" fill="#22c55e" />
    </g>

    <text x="0" y="65" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      BOOTLOADER UNLOCKED
    </text>
    <text x="0" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
      Fastboot · Stock ROM Restore · FRP Reset
    </text>

    <!-- Binary streaming rows -->
    <g font-family="'Courier New', monospace" font-size="10" fill="#64748b" text-anchor="middle">
      <text x="0" y="120">01000110 01001100 01000001 01010011</text>
      <text x="0" y="140" fill="#1E90FF">FLASHING SYSTEM.IMG ... SUCCESS</text>
      <text x="0" y="160">RECOVERY // FACTORY RESET CLEAN</text>
    </g>
  </g>

  <!-- Left Float Badge -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="160" height="85" rx="12" fill="#0f1d38" stroke="#1E90FF" stroke-width="1.5" />
    <text x="20" y="30" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#1E90FF">OS RECOVERY</text>
    <text x="20" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#FFFFFF">Bootloop Recovery</text>
    <text x="20" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b">Samsung, Xiaomi, Tecno</text>
  </g>

  <!-- Right Float Badge -->
  <g transform="translate(560, 340)">
    <rect x="0" y="0" width="160" height="85" rx="12" fill="#0f1d38" stroke="#22c55e" stroke-width="1.5" />
    <text x="20" y="30" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#22c55e">SOFTWARE RESET</text>
    <text x="20" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#FFFFFF">Factory Unlocking</text>
    <text x="20" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b">FRP Bypass Assistance</text>
  </g>
</svg>
